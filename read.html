<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Protected document · Knowledge Hub</title><style>body{font:16px/1.5 system-ui;background:#f6f8fa;color:#142840;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{background:white;max-width:430px;width:100%;border:1px solid #dde5ed;border-radius:16px;padding:32px}a{color:#087657}p{color:#66758a}.error{color:#a52a36}</style></head><body><main><h1>Protected document</h1><p>Sign in as Admin to open this document.</p>
<a href="/">Knowledge Hub sign-in</a><p id="error" class="error" role="alert"></p></main><script>
const path=new URLSearchParams(location.search).get('pathname');
const valid=!!path&&/^0[1-6]-[a-z-]+\/.+\.(?:html?|pdf)$/i.test(path)&&!path.split('/').some(p=>p==='.'||p==='..'||p.startsWith('.'));
if(!valid)document.getElementById('error').textContent='Invalid document link.';
else fetch('/api/session',{credentials:'same-origin',cache:'no-store'})
 .then(r=>r.json()).then(d=>{
  if(d.role==='admin')location.replace('/view.html?access=private&pathname='+encodeURIComponent(path));
 }).catch(()=>{});
</script></body></html>
