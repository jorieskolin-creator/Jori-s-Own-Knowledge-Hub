name: Knowledge Hub MCP tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'chat/**']
  workflow_dispatch:
jobs:
  oauth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if test -f package-lock.json; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - run: npm test
